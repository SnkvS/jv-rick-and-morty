databaseChangeLog:
  - changeSet:
      id: 1
      author: Rick Sanchez
      changes:
        - createTable:
            tableName: characters
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: external_id
                  type: bigint
                  constraints:
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: gender
                  type: varchar(50)
              - column:
                  name: status
                  type: varchar(255)
